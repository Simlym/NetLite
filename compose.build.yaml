# Development on a Linux test machine:
# docker compose -f compose.yaml -f compose.build.yaml up -d --build
services:
  netlite:
    image: netlite:dev
    build:
      context: .
      args:
        BASE_REGISTRY: ${NETLITE_BUILD_REGISTRY:-docker.io}
        BUILDKIT_SYNTAX: ${NETLITE_BUILDKIT_SYNTAX:-docker/dockerfile:1}
