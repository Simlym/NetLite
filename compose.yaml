services:
  netlite:
    image: ${NETLITE_IMAGE:-ghcr.io/simlym/netlite:main}
    environment:
      NETLITE_NETWORK_MODE: bridge
      # Keep these declarations in sync when adding custom TCP port mappings.
      NETLITE_PORT_MAPPINGS: "${NETLITE_HTTP_PORT:-18080}:18080,${NETLITE_HTTPS_PORT:-18443}:18443${NETLITE_EXTRA_PORT_MAPPINGS:-}"
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    ports:
      - "${NETLITE_MANAGEMENT_BIND:-127.0.0.1}:18780:18780"
      - "${NETLITE_HTTP_PORT:-18080}:18080/tcp"
      - "${NETLITE_HTTPS_PORT:-18443}:18443/tcp"
      - "${NETLITE_HTTPS_PORT:-18443}:18443/udp"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - netlite-data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  netlite-data:
