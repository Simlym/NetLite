services:
  netlite:
    image: ${NETLITE_IMAGE:-ghcr.io/simlym/netlite:main}
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    ports:
      - "${NETLITE_MANAGEMENT_BIND:-127.0.0.1}:18780:18780"
      - "18080:18080/tcp"
      - "18443:18443/tcp"
      - "18443:18443/udp"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - netlite-data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  netlite-data:
