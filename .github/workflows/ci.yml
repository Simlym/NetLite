name: CI
on:
  push:
    branches: [main, 'codex/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NETLITE_TEST_CADDY: ${{ github.workspace }}/tools/caddy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Prepare dependencies and formatting
        run: |
          go mod tidy
          gofmt -w cmd internal web/*.go
          git diff -- go.mod go.sum cmd internal web/*.go > /tmp/netlite-format.patch
          cat /tmp/netlite-format.patch
      - name: Build standard Caddy
        run: |
          mkdir -p tools bin
          GOBIN="$PWD/tools" CGO_ENABLED=0 go install github.com/caddyserver/caddy/v2/cmd/caddy@v2.11.7
      - name: Go tests
        run: go test ./...
      - name: Race checks
        run: go test -race ./internal/...
      - name: Go vet
        run: go vet ./...
      - name: Linux integration
        run: |
          CGO_ENABLED=0 go build -o bin/netlite ./cmd/netlite
          python3 scripts/smoke-linux.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Frontend checks
        working-directory: web
        run: |
          npm ci
          npm test
          npm run build
      - name: Linux panel authentication and embedded HTTPS
        run: |
          CGO_ENABLED=0 go build -tags webembed -o bin/netlite ./cmd/netlite
          python3 scripts/smoke-panel.py
          bash -n scripts/install-linux.sh scripts/build-linux.sh
      - name: Upload formatting diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: netlite-format-diagnostics
          path: /tmp/netlite-format.patch
          retention-days: 1
      - name: Enforce checked-in dependencies and formatting
        run: git diff --exit-code -- go.mod go.sum cmd internal web/*.go
      - name: Share verified frontend with deployment builds
        uses: actions/upload-artifact@v4
        with:
          name: netlite-web
          path: web/dist/
          if-no-files-found: error
          retention-days: 7
  windows-smoke:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Prepare modules and standard Caddy
        shell: pwsh
        run: |
          go mod tidy
          New-Item -ItemType Directory tools -Force | Out-Null
          $env:GOBIN=Join-Path (Get-Location) 'tools'
          go install github.com/caddyserver/caddy/v2/cmd/caddy@v2.11.7
          if($LASTEXITCODE){throw 'Caddy build failed'}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Frontend build
        working-directory: web
        run: |
          npm.cmd ci
          npm.cmd run build
      - name: HTTP and HTTPS integration
        shell: pwsh
        run: ./scripts/smoke.ps1
  packages:
    needs: [verify, windows-smoke]
    uses: ./.github/workflows/build.yml
